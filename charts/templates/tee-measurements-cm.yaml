apiVersion: v1
kind: ConfigMap
metadata:
  name: tee-measurements
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  tee_measurements.yaml: |
    # TEE Measurement Configuration
    # This file is managed via Kubernetes ConfigMap
    # Update the ConfigMap to add/modify measurement configurations
    #
    # Note: Matching is by full MRTD + RTMRs. Multiple configs may share the same RTMR0 (e.g. VM versions).
    # Each config must have a version (stored on attestation for audit trail).
    # debug is mandatory and must be a YAML boolean. Managed-release pins also require build-derived
    # image_sha256 + an ordered complete image_measurement_names matrix; production release
    # activation separately verifies canonical detached-cosign provenance.
    measurements:
      # Example measurement configuration - replace with actual values
      - version: "1"
        mrtd: "PLACEHOLDER_MRTD_96_HEX_CHARS"
        name: "8xh200"
        description: "8x H200 GPU configuration"
        debug: false
        boot_rtmrs:
          rtmr0: "PLACEHOLDER_RTMR0_96_HEX_CHARS"
          rtmr1: "PLACEHOLDER_RTMR1_96_HEX_CHARS"
          rtmr2: "PLACEHOLDER_RTMR2_96_HEX_CHARS"
          rtmr3: "PLACEHOLDER_RTMR3_96_HEX_CHARS"
        runtime_rtmrs:
          rtmr0: "PLACEHOLDER_RTMR0_96_HEX_CHARS"
          rtmr1: "PLACEHOLDER_RTMR1_96_HEX_CHARS"
          rtmr2: "PLACEHOLDER_RTMR2_96_HEX_CHARS"
          rtmr3: "PLACEHOLDER_RTMR3_96_HEX_CHARS"
        expected_gpus:
          - "h200"
        gpu_count: 8
      # Example CPU-only (GPU-less) TEE configuration.
      # gpu_count: 0 + expected_gpus: [] mark a CPU measurement: MRTD + RTMRs are verified and
      # all GPU-evidence / GPU-count checks are skipped. provider is an optional infra hint
      # ("gcp" | "bare-metal").
      - version: "1"
        mrtd: "PLACEHOLDER_CPU_MRTD_96_HEX_CHARS"
        name: "cpu-gcp"
        description: "CPU-only TEE configuration (no GPU)"
        provider: "gcp"
        debug: false
        boot_rtmrs:
          rtmr0: "PLACEHOLDER_CPU_RTMR0_96_HEX_CHARS"
          rtmr1: "PLACEHOLDER_CPU_RTMR1_96_HEX_CHARS"
          rtmr2: "PLACEHOLDER_CPU_RTMR2_96_HEX_CHARS"
          rtmr3: "PLACEHOLDER_CPU_RTMR3_96_HEX_CHARS"
        runtime_rtmrs:
          rtmr0: "PLACEHOLDER_CPU_RTMR0_96_HEX_CHARS"
          rtmr1: "PLACEHOLDER_CPU_RTMR1_96_HEX_CHARS"
          rtmr2: "PLACEHOLDER_CPU_RTMR2_96_HEX_CHARS"
          rtmr3: "PLACEHOLDER_CPU_RTMR3_96_HEX_CHARS"
        expected_gpus: []
        gpu_count: 0
      # Example AMD SEV-SNP (tee_type: sev-snp) CPU configuration. SNP has no MRTD/RTMRs: pin a
      # single 48B launch `measurement` (96 hex; OVMF+VMSA [+kernel/initrd/cmdline under
      # direct-kernel-boot]) reproduced offline by sev-snp-measure, the required guest `policy`
      # (DEBUG bit must be off), a minimum reported TCB (anti-rollback), and the AMD `processor_model`
      # (Genoa|Milan|Turin -> selects the KDS/ARK). `id_key_digest` optionally pins an owner id-block.
      - version: "1"
        name: "cpu-snp-genoa"
        description: "CPU-only AMD SEV-SNP configuration (no GPU)"
        provider: "bare-metal"
        tee_type: "sev-snp"
        processor_model: "Genoa"
        debug: false
        measurement: "PLACEHOLDER_SNP_MEASUREMENT_96_HEX_CHARS"
        policy: "0x30000"
        min_tcb:
          bootloader: 0
          tee: 0
          snp: 0
          microcode: 0
        expected_vmpl: 0
        # A provider: "gcp" SNP pin must also include real PCR8/PCR9 plus
        # vtpm_security_flags with exactly numeric tags "2", "3", "4", and "5" and the boolean
        # values observed in that image's signed Google AK extension.
        expected_gpus: []
        gpu_count: 0
      # ChuteFS storage-TD measurements (distinct image: storage-node + persistent-LUKS units baked
      # in; guest VERSION 1.6.0). Fill from the storage image build (rtmr3-measure / snp-measure).
      # The storage TD self-registers as a CPU server, so gpu_count MUST be 0.
      - version: "1.6.0"
        mrtd: "PLACEHOLDER_STORAGE_TDX_MRTD_96_HEX_CHARS"
        name: "storage-baremetal-tdx-1.6.0-4c8g"
        description: "ChuteFS storage TD (Intel TDX, bare-metal, 4c/8g)"
        provider: "bare-metal"
        debug: false
        boot_rtmrs:
          rtmr0: "PLACEHOLDER_STORAGE_TDX_RTMR0_96_HEX_CHARS"
          rtmr1: "PLACEHOLDER_STORAGE_TDX_RTMR1_96_HEX_CHARS"
          rtmr2: "PLACEHOLDER_STORAGE_TDX_RTMR2_96_HEX_CHARS"
          rtmr3: "PLACEHOLDER_STORAGE_TDX_RTMR3_96_HEX_CHARS"
        runtime_rtmrs:
          rtmr0: "PLACEHOLDER_STORAGE_TDX_RTMR0_96_HEX_CHARS"
          rtmr1: "PLACEHOLDER_STORAGE_TDX_RTMR1_96_HEX_CHARS"
          rtmr2: "PLACEHOLDER_STORAGE_TDX_RTMR2_96_HEX_CHARS"
          rtmr3: "PLACEHOLDER_STORAGE_TDX_RTMR3_96_HEX_CHARS"
        expected_gpus: []
        gpu_count: 0
      - version: "1.6.0-snp"
        name: "storage-baremetal-snp-genoa-1.6.0"
        description: "ChuteFS storage TD (AMD SEV-SNP, bare-metal Genoa)"
        provider: "bare-metal"
        tee_type: "sev-snp"
        processor_model: "Genoa"
        debug: false
        measurement: "PLACEHOLDER_STORAGE_SNP_MEASUREMENT_96_HEX_CHARS"
        policy: "0x30000"
        min_tcb:
          bootloader: 0
          tee: 0
          snp: 0
          microcode: 0
        expected_vmpl: 0
        expected_gpus: []
        gpu_count: 0
