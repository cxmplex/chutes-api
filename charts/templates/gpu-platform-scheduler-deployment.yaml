{{- if .Values.gpuPlatformScheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-platform-scheduler
  labels:
    {{- include "gpuPlatformScheduler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gpuPlatformScheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "gpuPlatformScheduler.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpuPlatformScheduler.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      {{- with .Values.gpuPlatformScheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpuPlatformScheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.gpuPlatformScheduler.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tee-measurements
          configMap:
            name: tee-measurements
        - name: guest-provenance-public-key
          secret:
            secretName: {{ .Values.provenance.publicKeySecretName | quote }}
            items:
              - key: {{ .Values.provenance.publicKeySecretKey | quote }}
                path: cosign.pub
        - name: l0-publisher-public-keys
          secret:
            secretName: {{ .Values.l0Publisher.publicKeyRegistrySecretName | quote }}
            items:
              - key: {{ .Values.l0Publisher.publicKeyRegistrySecretKey | quote }}
                path: keys.json
        - name: lc-certs
          secret:
            secretName: launch-config-certs
            items:
              - key: lc_jwt_private.pem
                path: lc_jwt_private.pem
        {{- include "chutes.redisCacertVolume" . | nindent 8 }}
      containers:
        - name: gpu-platform-scheduler
          image: {{ include "chutes.image" (list . .Values.gpuPlatformScheduler.image) | quote }}
          imagePullPolicy: {{ .Values.gpuPlatformScheduler.imagePullPolicy }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          command: ["uv", "run", "python", "-m", "api.gpu_scheduler"]
          env:
            {{- include "chutes.sensitiveEnv" . | nindent 12 }}
            {{- include "chutes.commonEnv" . | nindent 12 }}
            {{- include "chutes.loggingEnv" . | nindent 12 }}
            - name: TEE_MEASUREMENT_CONFIG_REQUIRED
              value: "true"
            - name: TRUSTED_PROVENANCE_PUBLIC_KEY_PATH
              value: /etc/chutes/provenance/cosign.pub
            - name: TRUSTED_L0_PUBLISHER_KEYS_PATH
              value: /etc/chutes/l0-publisher/keys.json
            - name: LAUNCH_CONFIG_PRIVATE_KEY_PATH
              value: /etc/lc-certs/lc_jwt_private.pem
            - name: DB_SSL
              value: {{ .Values.dbSsl | quote }}
          volumeMounts:
            - name: tee-measurements
              mountPath: "/etc/config"
              readOnly: true
            - name: guest-provenance-public-key
              mountPath: /etc/chutes/provenance
              readOnly: true
            - name: l0-publisher-public-keys
              mountPath: /etc/chutes/l0-publisher
              readOnly: true
            - name: lc-certs
              mountPath: /etc/lc-certs
              readOnly: true
            {{- include "chutes.redisCacertMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.gpuPlatformScheduler.resources | nindent 12 }}
{{- end }}
