{{- include "chutes.apiIsolationValidation" . -}}
{{- $apiPolicy := .Values.networkPolicies.api -}}
{{- $apiPeers := $apiPolicy.ingressPeers -}}
{{- if and .Values.networkPolicies.enabled $apiPolicy.enabled }}
{{- if empty $apiPeers }}
{{- fail "networkPolicies.api.enabled requires non-empty networkPolicies.api.ingressPeers" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress-netpol
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "api.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml $apiPeers | nindent 8 }}
      ports:
        - port: 8000
          protocol: TCP
{{- end }}
