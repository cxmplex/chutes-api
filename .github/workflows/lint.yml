name: Lint

on:
  pull_request:
  push:
    branches-ignore: [main, master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "--version"

      - name: Run lint
        run: make lint

  attestation-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install cosign
        run: |
          curl -fsSLO https://github.com/sigstore/cosign/releases/download/v2.5.3/cosign_2.5.3_amd64.deb
          sudo dpkg -i cosign_2.5.3_amd64.deb
          rm cosign_2.5.3_amd64.deb
          cosign version
      - name: Install test dependencies
        run: uv sync --extra dev
      - name: Run mandatory attestation policy suites
        run: >-
          uv run pytest -q
          tests/unit/test_cpu_measurements_config.py
          tests/unit/test_runtime_snp_e2e.py
          tests/unit/test_attestation_authority_protocol.py
          tests/unit/test_attestation_hardening.py
          tests/unit/test_gpu_runtime_sessions.py
          tests/unit/test_server_key_custody.py
          tests/unit/test_agent_channel_socket.py
          tests/unit/test_snp.py
          tests/unit/test_server_utils.py
          tests/unit/test_server_service.py
          tests/unit/test_instance_util_verify_tee_chute.py
          tests/unit/test_storage_attestation_fingerprints.py
          tests/unit/test_tee_measurements_endpoint.py
          tests/unit/test_release_provenance.py
          --junitxml=attestation-policy.xml
      - name: Reject skipped attestation policy tests
        run: >-
          uv run python -c
          "import xml.etree.ElementTree as E;
          root=E.parse('attestation-policy.xml').getroot();
          skipped=sum(int(s.get('skipped', 0)) for s in ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} mandatory attestation policy tests skipped'"

  storage-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chutes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d chutes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://user:password@127.0.0.1:5432/chutes
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DBMATE_BIN: /usr/local/bin/dbmate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dbmate
        run: >-
          sudo curl -fsSL -o /usr/local/bin/dbmate
          https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          && sudo chmod +x /usr/local/bin/dbmate
      - name: Install cosign
        run: |
          curl -fsSLO https://github.com/sigstore/cosign/releases/download/v2.5.3/cosign_2.5.3_amd64.deb
          sudo dpkg -i cosign_2.5.3_amd64.deb
          rm cosign_2.5.3_amd64.deb
          cosign version
      - name: Install test dependencies
        run: uv sync --extra dev
      - name: Run required schema and migration foundation unit tests
        run: >-
          uv run pytest -q
          tests/unit/test_storage_startup.py
          tests/unit/test_cpu_scheduler.py
          tests/unit/test_schema_catalog_contract.py
          --junitxml=schema-migration-foundation.xml
      - name: Reject skipped schema and migration foundation tests
        run: >-
          uv run python -c
          "import xml.etree.ElementTree as E;
          root=E.parse('schema-migration-foundation.xml').getroot();
          skipped=sum(int(s.get('skipped', 0)) for s in ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} schema and migration foundation tests skipped'"
      - name: Run mandatory release unit tests
        run: >-
          uv run pytest -q
          tests/unit/test_releases_service.py
          tests/unit/test_release_provenance.py
          tests/unit/test_model_b.py
          --junitxml=release-unit.xml
      - name: Reject skipped release unit tests
        run: >-
          uv run python -c
          "import xml.etree.ElementTree as E;
          root=E.parse('release-unit.xml').getroot();
          skipped=sum(int(s.get('skipped', 0)) for s in ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} release unit tests skipped'"
      - name: Run every mandatory real-PostgreSQL suite
        run: >-
          uv run pytest -q
          tests/integration/*_postgres.py
          --junitxml=postgres-remediation.xml
      - name: Reject skipped real-PostgreSQL tests
        run: >-
          uv run python -c
          "import xml.etree.ElementTree as E;
          root=E.parse('postgres-remediation.xml').getroot();
          skipped=sum(int(s.get('skipped', 0)) for s in ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} mandatory real-PostgreSQL tests skipped'"

  cross-repository-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chutes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d chutes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHUTES_CROSS_REPO_ROOT: ${{ github.workspace }}/cohort
      TEST_DATABASE_URL: postgresql+asyncpg://user:password@127.0.0.1:5432/chutes
    steps:
      - name: Check out API under the cohort root
        uses: actions/checkout@v4
        with:
          path: cohort/chutes-api
      - name: Check out miner contract producer/consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chutes-miner
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: cohort/chutes-miner
      - name: Check out sek8s contract producer/consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sek8s
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: cohort/sek8s
      - name: Check out SDK contract producer/consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chutes
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: cohort/chutes
      - uses: astral-sh/setup-uv@v6
      - name: Install API test dependencies
        working-directory: cohort/chutes-api
        run: uv sync --extra dev
      - name: Execute four-repository producer/consumer fixtures
        working-directory: cohort/chutes-api
        run: >-
          uv run pytest -q
          tests/unit/test_gpu_cross_worktree_contracts.py
          tests/integration/test_gpu_registration_agent_cross_repo.py
          --junitxml=cross-repository-contracts.xml
      - name: Reject skipped cross-repository fixtures
        working-directory: cohort/chutes-api
        run: >-
          uv run python -c
          "import xml.etree.ElementTree as E;
          root=E.parse('cross-repository-contracts.xml').getroot();
          skipped=sum(int(s.get('skipped', 0)) for s in ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} cross-repository fixtures skipped'"

  api-runtime-cosign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API runtime and smoke-test cosign verify-blob
        run: bash tests/docker/smoke_api_runtime_cosign.sh
