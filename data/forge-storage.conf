# Dev forge storage: the compose sets STORAGE_DRIVER=vfs (overlay/fuse-overlayfs needs /dev/fuse +
# privileges that aren't granted here), but the image's baked storage.conf declares
# mount_program=fuse-overlayfs. vfs rejects that option ("vfs driver does not support
# vfs.mount_program options"), which corrupts the layer store between buildah stages (stage 2 then
# can't find stage 1's local image and tries docker.io -> access denied). This clean vfs config has
# no mount_program, so multi-stage builds persist their intermediate images correctly.
[storage]
driver = "vfs"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
