user www-data;
worker_processes 64;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;
events {
    worker_connections 4096;
}
http {
    server_tokens off;
    ignore_invalid_headers off;
    client_max_body_size 0;
    log_format proxylog '$remote_addr\t$http_x_chutes_hotkey\t[$time_local] ($request_time) '
                '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $content_length';

    server {
        access_log /var/log/nginx/access.log proxylog;
        sendfile on;
        tcp_nopush on;
        listen 5100;
    
        location /v2/ {
            limit_except GET {
                deny all;
            }
            proxy_pass http://registry:5000;
            auth_request /auth;
            proxy_set_header Authorization $auth_resp_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Registry blobs are multi-GB; nginx's default response buffering caps the temp file at 1GB
            # (proxy_max_temp_file_size) and TRUNCATES larger blobs. Stream straight through instead.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    
        location = /auth {
            internal;
            proxy_pass http://api:8000/registry/auth;
            auth_request_set $auth_resp_authorization $upstream_http_authorization;
            proxy_set_header X-Chutes-Hotkey $http_x_chutes_hotkey;
            proxy_set_header X-Chutes-Nonce $http_x_chutes_nonce;
            proxy_set_header X-Chutes-Signature $http_x_chutes_signature;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            error_page 401 403 500 502 503 504 = @block;
        }
    
        location @block {
            return 401;
        }
    }
}
